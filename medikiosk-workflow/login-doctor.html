<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Login — Medikiosk</title>
<link rel="stylesheet" href="basic.css">
</head>
<body>

<header class="topbar">
  <div class="container">
    <a href="index.html" class="site-title">Medikiosk</a>
    <a href="index.html" class="home-link">← Back to login</a>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Login Page</a> &gt; For Doctors using given code</div>
  <h1>Doctor Login</h1>
  <div class="box">
    <p>Enter the doctor code provided to you.</p>
    <form onsubmit="event.preventDefault(); window.location.href='doctor.html';">
      <label for="code">Doctor code</label>
      <input type="text" id="code" placeholder="e.g. DOC-2026-014" required>
      <div class="actions">
        <button type="submit" class="btn">Continue to Doctor Portal</button>
      </div>
    </form>
  </div>
</div>

<footer class="pagefoot">Medikiosk workflow prototype — Team Runtime Terror</footer>
</body>
</html>
