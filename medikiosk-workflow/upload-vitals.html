<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Patient Vitals — Medikiosk</title>
<link rel="stylesheet" href="basic.css">
</head>
<body>

<header class="topbar">
  <div class="container">
    <a href="index.html" class="site-title">Medikiosk</a>
    <a href="index.html" class="home-link">Log out</a>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="hospital.html">Hospital Portal</a> &gt; Upload Patient Vitals</div>
  <h1>Upload Patient Vitals</h1>
  <div class="box">
    <form onsubmit="event.preventDefault(); document.getElementById('confirm').style.display='block';">
      <label for="pname">Patient name</label>
      <input type="text" id="pname" placeholder="Patient name" required>
      <label for="bp">Blood pressure</label>
      <input type="text" id="bp" placeholder="e.g. 128/84">
      <label for="temp">Temperature</label>
      <input type="text" id="temp" placeholder="e.g. 98.6 °F">
      <div class="actions">
        <button type="submit" class="btn">Save to Hospital Patient Vital Database</button>
      </div>
    </form>
    <div id="confirm" class="notice mt-16" style="display:none; margin-top:16px;">
      Vitals saved. They are now visible in the Hospital Patient Vital Database.
    </div>
  </div>

  <div class="actions">
    <a href="vital-database.html" class="btn btn-secondary">Go to Hospital Patient Vital Database</a>
    <a href="hospital.html" class="btn btn-secondary">Back to Hospital Portal</a>
  </div>
</div>

<footer class="pagefoot">Medikiosk workflow prototype — Team Runtime Terror</footer>
</body>
</html>
