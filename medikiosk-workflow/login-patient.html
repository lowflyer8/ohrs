<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Login — Medikiosk</title>
<link rel="stylesheet" href="basic.css">
</head>
<body>

<header class="topbar">
  <div class="container">
    <a href="index.html" class="site-title">Medikiosk</a>
    <a href="index.html" class="home-link">← Back to login</a>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Login Page</a> &gt; Patient using Aadhar ID</div>
  <h1>Patient Login</h1>
  <div class="box">
    <p>Enter your Aadhar ID to access your patient portal.</p>
    <form onsubmit="event.preventDefault(); window.location.href='patient.html';">
      <label for="aadhar">Aadhar ID</label>
      <input type="text" id="aadhar" placeholder="XXXX XXXX XXXX" required>
      <div class="actions">
        <button type="submit" class="btn">Continue to Patient Portal</button>
      </div>
    </form>
  </div>
</div>

<footer class="pagefoot">Medikiosk workflow prototype — Team Runtime Terror</footer>
</body>
</html>
